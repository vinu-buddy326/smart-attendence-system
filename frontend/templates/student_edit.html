<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student — Smart Attendance AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem; }
        .edit-wrap { width:100%; max-width:560px; animation: fadeIn 0.6s ease; }
    </style>
</head>
<body>
<div class="edit-wrap">
    <div style="text-align:center;margin-bottom:1.5rem">
        <a href="/students" class="btn-ghost" style="font-size:0.8rem;display:inline-flex"><i class="fas fa-arrow-left"></i> Back to Registry</a>
    </div>
    <div class="glass-panel" style="padding:2.5rem">
        <div style="text-align:center;margin-bottom:2rem">
            <div style="width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,rgba(26,115,232,0.2),rgba(0,198,255,0.2));margin:0 auto 1.2rem;display:flex;align-items:center;justify-content:center;border:1px solid rgba(26,115,232,0.2)">
                <i class="fas fa-user-pen" style="font-size:2rem;background:linear-gradient(135deg,var(--accent),var(--highlight));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text"></i>
            </div>
            <h1 style="font-size:1.5rem;margin-bottom:0.3rem">Edit Student Profile</h1>
            <p class="text-dim" style="font-size:0.85rem">{{ student[2] }} — {{ student[1] }}</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for cat, msg in messages %}
        <div class="alert alert-{{ 'success' if cat == 'success' else 'error' }}">
            <i class="fas fa-{{ 'check-circle' if cat == 'success' else 'triangle-exclamation' }}"></i>
            <span>{{ msg }}</span>
        </div>
        {% endfor %}{% endif %}{% endwith %}

        <form action="/students/edit/{{ student[0] }}" method="POST">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user"></i> Full Name *</label>
                <input type="text" name="name" class="custom-input" value="{{ student[1] }}" required>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-id-card"></i> Roll Number</label>
                    <input type="text" class="custom-input" value="{{ student[2] }}" disabled style="opacity:0.5;cursor:not-allowed">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-layer-group"></i> Section *</label>
                    <input type="text" name="section" class="custom-input" value="{{ student[3] }}" placeholder="e.g. B1" required>
                </div>
            </div>
            
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-university"></i> University Name</label>
                    <input type="text" name="university" class="custom-input" value="{{ student[9] or '' }}" placeholder="e.g. Stanford University">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-school"></i> Name of School / College</label>
                    <input type="text" name="school" class="custom-input" value="{{ student[10] or '' }}" placeholder="e.g. School of Engineering">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fas fa-phone"></i> Phone Number</label>
                <input type="text" name="phone_number" class="custom-input" value="{{ student[4] or '' }}" placeholder="+91XXXXXXXXXX">
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="custom-input" value="{{ student[5] or '' }}" placeholder="student@university.edu">
            </div>

            <div style="display:flex;gap:0.8rem;margin-top:1rem">
                <button type="submit" class="btn-neon" style="flex:1;justify-content:center">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a href="/students" class="btn-ghost">Cancel</a>
            </div>
        </form>

        {% if current_user.role == 'admin' %}
        <div class="divider"></div>
        <form action="/students/regenerate_id/{{ student[0] }}" method="POST">
            <button type="submit" class="btn-ghost" style="width:100%;justify-content:center;color:var(--warning);border-color:rgba(255,209,102,0.3)">
                <i class="fas fa-id-card"></i> Regenerate AI Identity Card
            </button>
        </form>
        {% endif %}
    </div>
</div>
</body>
</html>
